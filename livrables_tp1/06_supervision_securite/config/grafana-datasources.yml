# Sources de données Grafana, créées automatiquement au démarrage.
apiVersion: 1
datasources:
  # Métriques de l'API (Prometheus du cluster).
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.monitoring.svc:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

  # Logs pseudonymisés de l'API (Cloud Logging), pour croiser une anomalie des métriques
  # avec les requêtes en cause. Authentification par Workload Identity (compte de service
  # Kubernetes "grafana", rôle roles/logging.viewer : voir README).
  - name: Cloud Logging
    uid: cloud-logging
    type: googlecloud-logging-datasource
    access: proxy
    jsonData:
      authenticationType: gce
      defaultProject: PROJECT_ID
