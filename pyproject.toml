[project]
name = "ia-toxic-comments-detector"
version = "0.1.0"
description = "Détection de toxicité (score 0-100) : BERT, LSTM, LAYA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=2.1.0",
    "scikit-learn>=1.5",
    "spacy>=3.8.18",
    "torch>=2.9",
    "transformers>=4.46",
]

# Windows (RTX 5080, Blackwell sm_120) : wheels PyTorch CUDA 13.0, compatibles driver CUDA 13.2.
# macOS (M3) : wheels PyPI standards, avec support MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
