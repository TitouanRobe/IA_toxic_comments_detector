[project]
name = "ia-toxic-comments-detector"
version = "0.1.0"
description = "Détection de toxicité (score 0-100) : BERT, LSTM, LAYA"
readme = "README.md"
requires-python = ">=3.12"
# Dépendances d'inférence (API) : les seules installées dans l'image Docker.
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=2.0",
    "prometheus-client>=0.21",
    "torch>=2.9",
    "transformers>=4.46",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# Entraînement, évaluation et anonymisation (train.py, compare.py, anonymize.py...).
train = [
    "en-core-web-sm",
    "polars>=2.1.0",
    "scikit-learn>=1.5",
    "spacy>=3.8.18",
]
dev = [
    "httpx>=0.28.1",
    "locust>=2.32",
    "pytest>=8.3",
]

[tool.uv]
# `uv sync` en local installe tout ; l'image Docker n'installe que `dependencies`.
default-groups = ["train", "dev"]

# Windows (RTX 5080, Blackwell sm_120) : wheels PyTorch CUDA 13.0, compatibles driver CUDA 13.2.
# Linux (image Docker / Cloud Run) : wheels CPU, sans CUDA (image beaucoup plus légère).
# macOS (M3) : wheels PyPI standards, avec support MPS.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- Qualité et sécurité du code (pipeline CI : .github/workflows/devsecops.yml) ---
[tool.ruff]
line-length = 120
extend-exclude = ["artifacts", "old_artifacts", "results"]

[tool.ruff.lint]
# E/F : erreurs et pyflakes ; I : tri des imports ; B : bugs probables ; S : règles de sécurité
# (équivalent bandit dans ruff) ; UP : syntaxe Python moderne.
select = ["E", "F", "I", "B", "S", "UP"]
# E501 : longueur des lignes (commentaires en français) ; E741 : variable `l` ; B905 : zip(strict=).
ignore = ["E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# Scripts d'attaque et de test de charge : lancent des sous-processus et ouvrent des URL par
# conception, le code n'est pas embarqué dans l'image de production.
"loadtest/*" = ["S"]
"attack/*" = ["S"]
# Tests : les assert sont le mécanisme de pytest, et les clés de test sont factices.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # api.py et toxicity/ sont à la racine (pas de paquet installé)

[tool.bandit]
exclude_dirs = [".venv", "artifacts", "old_artifacts", "loadtest", "attack", "tests"]
# B615 : from_pretrained() sans `revision`. Les modèles de base sont téléchargés uniquement à
# l'entraînement (PRETRAINED dans toxicity/models/*.py) ; en production l'image fixe
# HF_HUB_OFFLINE=1 et charge les poids depuis un volume, aucun appel au Hub n'est fait.
skips = ["B615"]
