<text x="120" y="873" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">Accès par identité (Workload Identity)</text>
<line x1="460" y1="800" x2="540" y2="800" stroke="#15803d" stroke-width="2.2" marker-end="url(#m15803d)"/>
<text x="560" y="805" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">Supervision (métriques internes)</text>
<line x1="460" y1="834" x2="540" y2="834" stroke="#c2410c" stroke-width="2.2" marker-end="url(#mc2410c)"/>
<text x="560" y="839" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">Administration / déploiement</text>
<line x1="900" y1="745" x2="900" y2="895" stroke="#e2e8f0"/>
<text x="920" y="770" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="bold">Zero trust appliqué :</text>
<text x="920" y="797" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">- toute requête est authentifiée (clé d&#x27;API)</text>
<text x="920" y="824" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">- une identité par composant, droits minimaux (IAM)</text>
<text x="920" y="851" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">- chiffrement TLS en transit, AES-256 au repos</text>
<text x="920" y="878" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="normal">- accès aux secrets tracés (Cloud Audit Logs)</text>
<rect x="0" y="930" width="1410" height="310" rx="10" fill="#fff" stroke="#475569"/>
<text x="20" y="966" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="bold">Détail des flux</text>
<text x="20" y="1000" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">1</tspan>  Client → Cloud Armor → Load balancer : HTTPS (TLS) + clé X-API-Key</text>
<text x="20" y="1023" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">2</tspan>  Load balancer → Service interne → pods : NEG, réseau Google chiffré</text>
<text x="20" y="1047" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">3</tspan>  Secret Manager → pods : empreintes des clés, lues au démarrage (Workload Identity)</text>
<text x="20" y="1070" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">4</tspan>  Cloud Storage → pods : poids des modèles, GCS FUSE en lecture seule</text>
<text x="20" y="1094" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">5</tspan>  Pods → Cloud Logging : journal JSON pseudonymisé (stdout)</text>
<text x="20" y="1117" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">6</tspan>  Prometheus → pods : métriques sur le port 8081, interne au cluster</text>
<text x="20" y="1140" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">7</tspan>  Grafana → Cloud Logging : lecture des logs (Workload Identity)</text>
<text x="20" y="1164" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">8</tspan>  Équipe → supervision : kubectl port-forward (IAM + RBAC)</text>
<text x="20" y="1187" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">9</tspan>  Équipe → Artifact Registry : docker push (HTTPS, IAM)</text>
<text x="20" y="1211" font-size="15" fill="#1e1e1e"><tspan font-weight="bold">10</tspan>  Artifact Registry → cluster : pull de l&#x27;image (compte de service des nœuds)</text>
